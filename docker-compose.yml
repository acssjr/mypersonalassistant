services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.7.1-2}
        GOGCLI_IMAGE: ${GOGCLI_IMAGE:-ghcr.io/openclaw/gogcli:v0.34.1}
    image: ${PERSONAL_ASSISTANT_IMAGE:-personal-assistant-openclaw:local}
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      GOG_HOME: /home/node/.openclaw/gog
      GOG_ACCOUNT: ${GOG_ACCOUNT:-}
      GOG_KEYRING_BACKEND: file
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      TZ: ${OPENCLAW_TZ:-America/Bahia}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./work/openclaw-state}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./services/assistant/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-./work/openclaw-auth}:/home/node/.config/openclaw
      - ${OPENCLAW_CODEX_HOME_DIR:-./work/openclaw-codex}:/home/node/.codex
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  openclaw-cli:
    image: ${PERSONAL_ASSISTANT_IMAGE:-personal-assistant-openclaw:local}
    network_mode: service:openclaw-gateway
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      GOG_HOME: /home/node/.openclaw/gog
      GOG_ACCOUNT: ${GOG_ACCOUNT:-}
      GOG_KEYRING_BACKEND: file
      GOG_KEYRING_PASSWORD: ${GOG_KEYRING_PASSWORD:-}
      BROWSER: echo
      TZ: ${OPENCLAW_TZ:-America/Bahia}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-./work/openclaw-state}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-./services/assistant/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:-./work/openclaw-auth}:/home/node/.config/openclaw
      - ${OPENCLAW_CODEX_HOME_DIR:-./work/openclaw-codex}:/home/node/.codex
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      openclaw-gateway:
        condition: service_healthy
